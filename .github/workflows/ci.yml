name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [6.x, 8.x, 10.x, 12.x, 14.x, 16.x, 17.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3.3.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: |
          if node -e 'process.exit(+process.versions.node.split(".")[0] < 8 ? 0 : 1)'; then
            # npm 3 (Node 6) fails to install airtap's dependency tree. The unit tests only
            # need tape and sinon, so install those at the versions package.json declares.
            npm install --production
            npm install $(node -p "['tape', 'sinon'].map(function (n) { return n + '@' + require('./package.json').devDependencies[n] }).join(' ')")
          else
            npm install
          fi
      - name: Run Tests
        run: |
          npm run test

  automerge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: fastify/github-action-merge-dependabot@v2.7.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
